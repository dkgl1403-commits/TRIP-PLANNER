  <body class="bg-surface text-on-surface min-h-screen relative overflow-x-hidden font-body-md text-body-md selection:bg-neon-coral/30 selection:text-white">

    <div class="fixed inset-0 z-[-1] bg-gradient-to-b from-surface/50 via-surface/80 to-surface pointer-events-none"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
