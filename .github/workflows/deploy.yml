name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies & Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
          
      - name: Add Server to Known Hosts
        run: ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Frontend & Backend to Server
        run: |
          scp -r frontend/dist backend ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/home/ubuntu/TRIP_Planner/

      - name: Restart Backend & Fix Permissions
        run: |
          ssh ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'
            sudo chmod -R 755 /home/ubuntu/TRIP_Planner/frontend/dist
            cd /home/ubuntu/TRIP_Planner/backend
            pip install -r requirements.txt || true
            pkill -f uvicorn || true
            nohup ~/.local/bin/uvicorn main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          EOF
