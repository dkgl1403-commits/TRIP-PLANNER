name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies & Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Deploy Frontend & Backend to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "frontend/dist/,backend/,package.json"
          target: "/home/ubuntu/TRIP_Planner"
          strip_components: 0

      - name: Restart Backend & Fix Permissions
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Fix frontend permissions for Nginx
            sudo chmod -R 755 /home/ubuntu/TRIP_Planner/frontend/dist
            
            # Restart the FastAPI backend
            cd /home/ubuntu/TRIP_Planner/backend
            pip install -r requirements.txt || true
            pkill -f uvicorn || true
            nohup ~/.local/bin/uvicorn main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
