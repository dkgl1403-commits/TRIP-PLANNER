server {
    listen 80;
    listen [::]:80;
    server_name 80.225.208.24.nip.io 80.225.208.24;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 80.225.208.24.nip.io;

    ssl_certificate /etc/letsencrypt/live/80.225.208.24.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/80.225.208.24.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/ubuntu/TRIP_Planner/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
